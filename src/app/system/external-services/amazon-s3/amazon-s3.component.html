<div class="container">
  <div class="ms-page">
    <div class="ms-actions align-end">
      <button mat-flat-button color="primary" [routerLink]="['edit']">
        <fa-icon icon="edit" class="m-r-10"></fa-icon>
        {{ 'labels.buttons.Edit' | translate }}
      </button>
    </div>

    <div class="ms-panel">
      <div class="ms-table-wrap">
        <table mat-table [dataSource]="dataSource" matSort>
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>{{ 'labels.inputs.name' | translate }}</th>
            <td mat-cell *matCellDef="let configuration" class="ms-cell-name">
              {{ configuration.name | translateKey: 'inputs' }}
            </td>
          </ng-container>

          <ng-container matColumnDef="value">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>{{ 'labels.inputs.Value' | translate }}</th>
            <td mat-cell *matCellDef="let configuration" class="ms-cell-muted">
              {{ getConfigurationValue(configuration) }}
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>
      </div>
    </div>
  </div>
</div>
