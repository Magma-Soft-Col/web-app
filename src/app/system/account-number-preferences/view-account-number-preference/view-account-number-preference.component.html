<div class="container">
  <div class="ms-page">
    <div class="ms-actions align-end">
      <button mat-stroked-button color="warn" (click)="delete()" *mifosxHasPermission="'DELETE_ACCOUNTNUMBERFORMAT'">
        <fa-icon icon="trash" class="m-r-10"></fa-icon>
        {{ 'labels.buttons.Delete' | translate }}
      </button>

      <button
        mat-flat-button
        color="primary"
        [routerLink]="['edit']"
        *mifosxHasPermission="'UPDATE_ACCOUNTNUMBERFORMAT'"
      >
        <fa-icon icon="edit" class="m-r-10"></fa-icon>
        {{ 'labels.buttons.Edit' | translate }}
      </button>
    </div>

    <mat-card>
      <mat-card-content>
        <div class="detail-list">
          <div class="ms-detail-row">
            <span class="ms-label">{{ 'labels.inputs.Account Type' | translate }}</span>
            <span class="ms-value">{{ accountNumberPreferenceData.accountType.value | translateKey: 'catalogs' }}</span>
          </div>

          @if (accountNumberPreferenceData.prefixType) {
            <div class="ms-detail-row">
              <span class="ms-label">{{ 'labels.inputs.Prefix Type' | translate }}</span>
              <span class="ms-value">{{ accountNumberPreferenceData.prefixType.value }}</span>
            </div>
          }
        </div>
      </mat-card-content>
    </mat-card>
  </div>
</div>
