<div class="ms-page jobs-page">
  <div class="ms-list-toolbar">
    <div #cobCatchUpStatus class="catch-up-status">
      <span class="ms-label">{{ 'labels.heading.COB Catch-Up is' | translate }}</span>
      @if (isCatchUpRunning) {
        <span class="ms-badge ms-badge--info">{{ 'labels.catalogs.Running' | translate }}</span>
      } @else {
        <span class="ms-badge">{{ 'labels.catalogs.Inactive' | translate }}</span>
      }
    </div>
    @if (!isCatchUpRunning) {
      <div class="ms-actions">
        <button mat-flat-button color="primary" (click)="runCatchUp()">
          <fa-icon icon="play" class="m-r-10"></fa-icon>
          {{ 'labels.buttons.Run Catch-Up' | translate }}
        </button>
      </div>
    }
  </div>

  <mifosx-loan-locked></mifosx-loan-locked>
</div>
