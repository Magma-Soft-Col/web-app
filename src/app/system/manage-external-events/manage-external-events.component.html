<div class="container">
  <div class="ms-page">
    <div class="ms-list-toolbar">
      <div class="ms-filter-bar">
        <div #filter class="ms-search">
          <fa-icon icon="search" class="ms-search__icon" aria-hidden="true"></fa-icon>
          <input
            type="search"
            (keyup)="applyFilter($any($event.target).value)"
            [placeholder]="'labels.inputs.Filter' | translate"
            [attr.aria-label]="'labels.inputs.Filter' | translate"
          />
        </div>
      </div>
      <div class="ms-actions">
        <button
          mat-flat-button
          color="primary"
          (click)="applyChanges()"
          [disabled]="!existAnyUpdate"
          *mifosxHasPermission="'UPDATE_EXTERNAL_EVENT_CONFIGURATION'"
        >
          {{ 'labels.buttons.Apply Changes' | translate }}
        </button>
      </div>
    </div>

    <div #eventsTable class="ms-panel">
      <div class="ms-table-wrap">
        <table mat-table [dataSource]="dataSource" matSort>
          <ng-container matColumnDef="eventType">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>{{ 'labels.inputs.Event Type' | translate }}</th>
            <td mat-cell *matCellDef="let event" class="ms-cell-name">{{ event.type | translateKey: 'text' }}</td>
          </ng-container>

          <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>{{ 'labels.inputs.Status' | translate }}</th>
            <td mat-cell *matCellDef="let event">
              <mat-slide-toggle [(ngModel)]="event.enabled" name="{{ event.type }}" (click)="toggleStatus(event)">
                @if (event.enabled) {
                  <span class="ms-status ms-status--success">{{ 'labels.inputs.Enabled' | translate }}</span>
                } @else {
                  <span class="ms-status ms-status--neutral">{{ 'labels.inputs.Disabled' | translate }}</span>
                }
              </mat-slide-toggle>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns" class="select-row"></tr>
          <tr class="mat-mdc-row" *matNoDataRow>
            <td class="mat-mdc-cell ms-empty-cell" [attr.colspan]="displayedColumns.length">
              {{ 'labels.text.No results found' | translate }}
            </td>
          </tr>
        </table>
      </div>

      <mat-paginator [pageSizeOptions]="[10, 25, 50, 100]" showFirstLastButtons></mat-paginator>
    </div>
  </div>
</div>
