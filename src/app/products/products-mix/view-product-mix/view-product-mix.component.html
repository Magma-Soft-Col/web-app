<div class="container">
  <div class="ms-page">
    <div class="ms-page-header detail-header">
      <div class="ms-actions">
        <button mat-stroked-button color="warn" (click)="delete()" *mifosxHasPermission="'DELETE_PRODUCTMIX'">
          <fa-icon icon="trash" class="m-r-10"></fa-icon>
          {{ 'labels.buttons.Delete' | translate }}
        </button>
        <button mat-flat-button color="primary" [routerLink]="['edit']" *mifosxHasPermission="'UPDATE_PRODUCTMIX'">
          <fa-icon icon="edit" class="m-r-10"></fa-icon>
          {{ 'labels.buttons.Edit' | translate }}
        </button>
      </div>
    </div>

    <div class="ms-panel">
      <div class="ms-table-wrap">
        <table mat-table [dataSource]="restrictedProductsDatasource" matSort class="ms-list-table">
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>
              {{ 'labels.inputs.Restricted products' | translate }}
            </th>
            <td mat-cell *matCellDef="let product" class="ms-cell-name">{{ product.name }}</td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="restrictedProductsDisplayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: restrictedProductsDisplayedColumns"></tr>
        </table>
      </div>

      <mat-paginator #restricted [pageSizeOptions]="[10, 25, 50, 100]" showFirstLastButtons></mat-paginator>
    </div>

    <div class="ms-panel">
      <div class="ms-table-wrap">
        <table mat-table [dataSource]="allowedProductsDatasource" matSort class="ms-list-table">
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>
              {{ 'labels.inputs.Allowed Products' | translate }}
            </th>
            <td mat-cell *matCellDef="let product" class="ms-cell-name">{{ product.name }}</td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="allowedProductsDisplayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: allowedProductsDisplayedColumns"></tr>
        </table>
      </div>

      <mat-paginator #allowed [pageSizeOptions]="[10, 25, 50, 100]" showFirstLastButtons></mat-paginator>
    </div>
  </div>
</div>
