<!-- The page title is rendered by the shell header. -->
<div class="ms-page landing-page">
  <p class="ms-page-subtitle landing-page__copy">{{ 'labels.text.Select a product below' | translate }}</p>

  <section class="product-grid">
    <mat-card
      *ngFor="let product of productCards"
      class="product-card"
      [class.product-card--active]="product.active"
      [class.product-card--disabled]="product.disabled"
    >
      <div class="product-card__header">
        <span class="ms-icon-wrap product-card__icon">
          <mat-icon aria-hidden="true">{{ product.icon }}</mat-icon>
        </span>
        <span class="ms-badge" [class.ms-badge--success]="product.active">
          {{ (product.active ? 'labels.inputs.Active' : 'labels.text.Upcoming') | translate }}
        </span>
      </div>

      <h3 class="product-card__title">{{ product.name | translate }}</h3>
      <p class="product-card__description">{{ product.description | translate }}</p>

      <a
        *ngIf="product.active"
        mat-stroked-button
        class="product-card__cta"
        [routerLink]="['/products', 'loan-products', product.route]"
        [queryParams]="{ productType: 'loan' }"
      >
        {{ 'labels.buttons.Create' | translate }}
      </a>
    </mat-card>
  </section>
</div>
