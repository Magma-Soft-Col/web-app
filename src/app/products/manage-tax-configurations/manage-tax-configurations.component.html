<div class="container">
  <div class="ms-settings-grid">
    <nav class="ms-panel ms-settings-list">
      <a class="ms-settings-row" [routerLink]="['tax-components']" *mifosxHasPermission="'READ_TAXCOMPONENT'">
        <span class="ms-icon-wrap" aria-hidden="true"><fa-icon icon="building"></fa-icon></span>
        <span class="ms-settings-row__text">
          <span class="ms-settings-row__title">{{ 'labels.heading.Manage Tax Components' | translate }}</span>
          <span class="ms-settings-row__desc">{{ 'labels.heading.Define Tax Components' | translate }}</span>
        </span>
        <fa-icon class="ms-settings-row__chevron" icon="chevron-right" aria-hidden="true"></fa-icon>
      </a>

      <a class="ms-settings-row" [routerLink]="['tax-groups']" *mifosxHasPermission="'READ_TAXGROUP'">
        <span class="ms-icon-wrap" aria-hidden="true"><fa-icon icon="building"></fa-icon></span>
        <span class="ms-settings-row__text">
          <span class="ms-settings-row__title">{{ 'labels.heading.Manage Tax Groups' | translate }}</span>
          <span class="ms-settings-row__desc">{{ 'labels.heading.Define Tax Groups' | translate }}</span>
        </span>
        <fa-icon class="ms-settings-row__chevron" icon="chevron-right" aria-hidden="true"></fa-icon>
      </a>
    </nav>
  </div>
</div>
