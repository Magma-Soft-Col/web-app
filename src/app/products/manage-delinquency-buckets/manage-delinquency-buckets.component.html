<div class="container">
  <div class="ms-settings-grid">
    <nav class="ms-panel ms-settings-list">
      <a class="ms-settings-row" [routerLink]="['ranges']" *mifosxHasPermission="'READ_DELINQUENCY_RANGE'">
        <span class="ms-icon-wrap" aria-hidden="true"><fa-icon icon="building"></fa-icon></span>
        <span class="ms-settings-row__text">
          <span class="ms-settings-row__title">{{ 'labels.heading.Manage Delinquency Ranges' | translate }}</span>
          <span class="ms-settings-row__desc">{{ 'labels.text.Define delinquency day ranges' | translate }}</span>
        </span>
        <fa-icon class="ms-settings-row__chevron" icon="chevron-right" aria-hidden="true"></fa-icon>
      </a>

      <a class="ms-settings-row" [routerLink]="['buckets']" *mifosxHasPermission="'READ_DELINQUENCY_BUCKET'">
        <span class="ms-icon-wrap" aria-hidden="true"><fa-icon icon="building"></fa-icon></span>
        <span class="ms-settings-row__text">
          <span class="ms-settings-row__title">{{ 'labels.heading.Manage Delinquency Buckets' | translate }}</span>
          <span class="ms-settings-row__desc">{{
            'labels.text.Define delinquency bucket as set of ranges' | translate
          }}</span>
        </span>
        <fa-icon class="ms-settings-row__chevron" icon="chevron-right" aria-hidden="true"></fa-icon>
      </a>
    </nav>
  </div>
</div>
