<div class="container">
  <div class="ms-page">
    <div class="ms-list-toolbar">
      <div class="ms-filter-bar">
        <div class="ms-search">
          <fa-icon icon="search" class="ms-search__icon" aria-hidden="true"></fa-icon>
          <input
            type="search"
            (input)="applyFilter($any($event.target).value)"
            [placeholder]="'labels.inputs.Filter' | translate"
            [attr.aria-label]="'labels.inputs.Filter' | translate"
          />
        </div>
      </div>
      <div class="ms-actions">
        <button
          mat-flat-button
          color="primary"
          [routerLink]="['create']"
          *mifosxHasPermission="'CREATE_DELINQUENCY_RANGE'"
        >
          <fa-icon icon="plus" class="m-r-10"></fa-icon>
          {{ 'labels.text.Create Delinquency Range' | translate }}
        </button>
      </div>
    </div>

    <div class="ms-panel">
      <div class="ms-table-wrap">
        <table mat-table [dataSource]="dataSource" matSort class="ms-list-table">
          <ng-container matColumnDef="classification">
            <th mat-header-cell *matHeaderCellDef mat-sort-header="classification">
              {{ 'labels.inputs.Classification' | translate }}
            </th>
            <td mat-cell *matCellDef="let delinquencyRange" class="ms-cell-name">
              {{ delinquencyRange.classification }}
            </td>
          </ng-container>

          <ng-container matColumnDef="minimumAgeDays">
            <th mat-header-cell *matHeaderCellDef mat-sort-header="minimumAgeDays" class="ms-num">
              {{ 'labels.inputs.Days From' | translate }}
            </th>
            <td mat-cell *matCellDef="let delinquencyRange" class="ms-num">{{ delinquencyRange.minimumAgeDays }}</td>
          </ng-container>

          <ng-container matColumnDef="maximumAgeDays">
            <th mat-header-cell *matHeaderCellDef mat-sort-header="maximumAgeDays" class="ms-num">
              {{ 'labels.inputs.Days Till' | translate }}
            </th>
            <td mat-cell *matCellDef="let delinquencyRange" class="ms-num">{{ delinquencyRange.maximumAgeDays }}</td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns" [routerLink]="[row.id]" class="select-row"></tr>
        </table>
      </div>

      <mat-paginator [pageSizeOptions]="[10, 25, 50, 100]" showFirstLastButtons></mat-paginator>
    </div>
  </div>
</div>
