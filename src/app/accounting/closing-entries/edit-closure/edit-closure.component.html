<div class="container">
  <mat-card>
    <form [formGroup]="accountingClosureForm" (ngSubmit)="submit()">
      <mat-card-content>
        <div class="ms-form-grid">
          <mat-form-field>
            <mat-label>{{ 'labels.inputs.Office' | translate }}</mat-label>
            <mat-select required formControlName="officeId">
              @for (office of officeData; track office) {
                <mat-option [value]="office.id">
                  {{ office.name }}
                </mat-option>
              }
            </mat-select>
          </mat-form-field>

          <mat-form-field (click)="closingDatePicker.open()">
            <mat-label>{{ 'labels.inputs.Closing Date' | translate }}</mat-label>
            <input matInput [matDatepicker]="closingDatePicker" required formControlName="closingDate" />
            <mat-datepicker-toggle matSuffix [for]="closingDatePicker"></mat-datepicker-toggle>
            <mat-datepicker #closingDatePicker></mat-datepicker>
          </mat-form-field>

          <mat-form-field class="ms-form-full">
            <mat-label>{{ 'labels.inputs.Comments' | translate }}</mat-label>
            <textarea matInput formControlName="comments" cdkTextareaAutosize cdkAutosizeMinRows="2"></textarea>
          </mat-form-field>
        </div>
      </mat-card-content>

      <mat-card-actions class="ms-form-actions">
        <button type="button" mat-stroked-button [routerLink]="['../']">
          {{ 'labels.buttons.Cancel' | translate }}
        </button>
        <button mat-flat-button color="primary" [disabled]="accountingClosureForm.pristine">
          {{ 'labels.buttons.Submit' | translate }}
        </button>
      </mat-card-actions>
    </form>
  </mat-card>
</div>
