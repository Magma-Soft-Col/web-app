<div class="container">
  <div class="ms-page">
    <div class="ms-actions page-actions">
      <button type="button" mat-stroked-button [routerLink]="['../']">
        {{ 'labels.buttons.Back' | translate }}
      </button>
      <button mat-flat-button color="primary" [routerLink]="['edit']" *mifosxHasPermission="'UPDATE_FUND'">
        <fa-icon icon="edit" class="m-r-10"></fa-icon>
        {{ 'labels.buttons.Edit' | translate }}
      </button>
    </div>

    <section class="ms-panel ms-panel--padded">
      <div class="ms-detail-row">
        <span class="ms-label">{{ 'labels.inputs.name' | translate }}</span>
        <span class="ms-value">{{ fundData.name }}</span>
      </div>
      <div class="ms-detail-row">
        <span class="ms-label">{{ 'labels.inputs.External Id' | translate }}</span>
        <span class="ms-value">
          <mifosx-external-identifier
            externalId="{{ fundData.externalId }}"
            completed="true"
          ></mifosx-external-identifier>
        </span>
      </div>
    </section>
  </div>
</div>
