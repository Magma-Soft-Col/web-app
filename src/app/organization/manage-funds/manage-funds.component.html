<div class="container">
  <div class="ms-page">
    <div class="ms-list-toolbar">
      <div class="ms-filter-bar">
        <div #filter class="ms-search">
          <fa-icon icon="search" class="ms-search__icon" aria-hidden="true"></fa-icon>
          <input
            type="search"
            (input)="applyFilter($any($event.target).value)"
            [placeholder]="'labels.inputs.Filter' | translate"
            [attr.aria-label]="'labels.inputs.Filter' | translate"
          />
        </div>
      </div>
      <div class="ms-actions">
        <div #fundFormRef>
          <button mat-flat-button color="primary" [routerLink]="['create']" *mifosxHasPermission="'CREATE_FUND'">
            <fa-icon icon="plus" class="m-r-10"></fa-icon>
            {{ 'labels.buttons.Create Fund' | translate }}
          </button>
        </div>
      </div>
    </div>

    <div #chargesTable class="ms-panel">
      <div class="ms-table-wrap">
        <table mat-table [dataSource]="dataSource" matSort>
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>{{ 'labels.inputs.name' | translate }}</th>
            <td mat-cell *matCellDef="let charge" class="ms-cell-name">{{ charge.name }}</td>
          </ng-container>

          <ng-container matColumnDef="externalId">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>{{ 'labels.inputs.External Id' | translate }}</th>
            <td mat-cell *matCellDef="let charge" class="ms-cell-muted">
              <mifosx-external-identifier externalId="{{ charge.externalId }}"></mifosx-external-identifier>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns" [routerLink]="[row.id]" class="select-row"></tr>
          <tr class="mat-mdc-row" *matNoDataRow>
            <td class="mat-mdc-cell ms-empty-cell" [attr.colspan]="displayedColumns.length">
              {{ 'labels.text.No results found' | translate }}
            </td>
          </tr>
        </table>
      </div>

      <mat-paginator [pageSizeOptions]="[10, 25, 50, 100]" showFirstLastButtons></mat-paginator>
    </div>
  </div>
</div>

<ng-template #templateFundFormRef let-popover="popover">
  <h2>{{ 'labels.heading.Manage Funds' | translate }}</h2>
  <p class="mw300">
    {{ 'labels.text.Used Add Fund' | translate }}:
    <a [href]="'manageFunds' | documentationLink" target="_blank" rel="noopener noreferrer">{{
      'labels.inputs.Manage Funds' | translate
    }}</a>
  </p>
  <div class="layout-row align-end gap-2px responsive-column">
    <button mat-stroked-button color="warn" (click)="popover.close(); configurationWizardService.closeConfigWizard()">
      Close
    </button>
    <button mat-flat-button color="primary" (click)="popover.close()">
      {{ 'labels.buttons.Add Funds' | translate }}
    </button>
    <button mat-flat-button color="primary" (click)="popover.close(); previousStep()">
      {{ 'labels.buttons.Back' | translate }}
    </button>
    <button mat-flat-button color="primary" (click)="popover.close(); nextStep()">
      {{ 'labels.buttons.Next' | translate }}
    </button>
  </div>
</ng-template>
