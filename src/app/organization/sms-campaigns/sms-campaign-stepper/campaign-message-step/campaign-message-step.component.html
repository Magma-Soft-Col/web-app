<div class="step-content">
  <mat-form-field class="ms-form-full">
    <mat-label>{{ 'labels.inputs.Campaign Message' | translate }}</mat-label>
    <textarea matInput [formControl]="message"></textarea>
  </mat-form-field>

  <h3 class="ms-subsection-title">{{ 'labels.heading.Template Parameters' | translate }}</h3>

  <div class="parameter-list">
    @for (label of parameterLabels; track label) {
      <button mat-stroked-button color="primary" class="parameter" (click)="addText(label)">
        {{ label }}
      </button>
    }
  </div>

  <div class="ms-form-actions">
    <button mat-stroked-button matStepperPrevious>
      <fa-icon icon="arrow-left" class="m-r-10"></fa-icon>
      {{ 'labels.buttons.Previous' | translate }}
    </button>
    <button mat-flat-button color="primary" matStepperNext [disabled]="!smsCampaignFormValid">
      {{ 'labels.buttons.Next' | translate }}
      <fa-icon icon="arrow-right" class="m-l-10"></fa-icon>
    </button>
  </div>
</div>
