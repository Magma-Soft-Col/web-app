<div class="container">
  <div class="ms-settings-grid">
    <!-- Left Column -->
    <nav class="ms-panel ms-settings-list">
      @for (option of bulkImportOptions.slice(0, 9); track option.index) {
        <div [attr.data-id]="option.routerLink">
          <a class="ms-settings-row" [routerLink]="[option.routerLink]" *mifosxHasPermission="option.permission">
            <span class="ms-icon-wrap" aria-hidden="true"><fa-icon [icon]="option.icon"></fa-icon></span>
            <span class="ms-settings-row__text">
              <span class="ms-settings-row__title">{{ option.title | translate }}</span>
              <span class="ms-settings-row__desc">{{ option.explanation | translate }}</span>
            </span>
            <fa-icon class="ms-settings-row__chevron" icon="chevron-right" aria-hidden="true"></fa-icon>
          </a>
        </div>
      }
    </nav>

    <!-- Right Column -->
    <nav class="ms-panel ms-settings-list">
      @for (option of bulkImportOptions.slice(9); track option.index) {
        <div [attr.data-id]="option.routerLink">
          <a class="ms-settings-row" [routerLink]="[option.routerLink]" *mifosxHasPermission="option.permission">
            <span class="ms-icon-wrap" aria-hidden="true"><fa-icon [icon]="option.icon"></fa-icon></span>
            <span class="ms-settings-row__text">
              <span class="ms-settings-row__title">{{ option.title | translate }}</span>
              <span class="ms-settings-row__desc">{{ option.explanation | translate }}</span>
            </span>
            <fa-icon class="ms-settings-row__chevron" icon="chevron-right" aria-hidden="true"></fa-icon>
          </a>
        </div>
      }
    </nav>
  </div>
</div>
