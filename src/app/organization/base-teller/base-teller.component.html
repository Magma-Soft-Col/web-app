<div class="container base-teller">
  <nav class="ms-panel ms-settings-list" [attr.aria-label]="'labels.text.Base Teller' | translate">
    @for (workflow of workflows; track workflow.route) {
      <a class="ms-settings-row" *mifosxHasPermission="workflow.permission" [routerLink]="workflow.route">
        <span class="ms-icon-wrap" aria-hidden="true">
          @if (workflow.fontAwesomeIcon) {
            <fa-icon [icon]="workflow.fontAwesomeIcon"></fa-icon>
          } @else {
            <mat-icon class="workflow-icon">{{ workflow.materialIcon }}</mat-icon>
          }
        </span>
        <span class="ms-settings-row__text">
          <span class="ms-settings-row__title">{{ workflow.label | translate }}</span>
        </span>
        <fa-icon class="ms-settings-row__chevron" icon="chevron-right" aria-hidden="true"></fa-icon>
      </a>
    }
  </nav>
</div>
