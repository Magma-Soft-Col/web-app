<div class="container">
  <div class="ms-page">
    <div class="ms-actions page-actions">
      <button mat-flat-button color="primary" [routerLink]="['./edit']" *mifosxHasPermission="'UPDATE_OFFICE'">
        <fa-icon icon="edit" class="m-r-10"></fa-icon>
        {{ 'labels.buttons.Edit' | translate }}
      </button>
    </div>

    <div class="office-tabs">
      <nav mat-tab-nav-bar class="navigation-tabs" [tabPanel]="tabPanel">
        <a
          mat-tab-link
          [routerLink]="['./general']"
          routerLinkActive
          #general="routerLinkActive"
          [active]="general.isActive"
        >
          {{ 'labels.inputs.General' | translate }}
        </a>
        <a
          mat-tab-link
          [routerLink]="['./address']"
          routerLinkActive
          #address="routerLinkActive"
          [active]="address.isActive"
          *mifosxHasPermission="'READ_OFFICE'"
        >
          {{ 'labels.heading.Address' | translate }}
        </a>
        <a
          mat-tab-link
          [routerLink]="['./services']"
          routerLinkActive
          #services="routerLinkActive"
          [active]="services.isActive"
          *mifosxHasPermission="'READ_OFFICE'"
        >
          {{ 'labels.heading.Services' | translate }}
        </a>
        <a
          mat-tab-link
          [routerLink]="['./schedules']"
          routerLinkActive
          #schedules="routerLinkActive"
          [active]="schedules.isActive"
          *mifosxHasPermission="'READ_OFFICE'"
        >
          {{ 'labels.heading.Schedules' | translate }}
        </a>
        @for (officeDatatable of officeDatatables; track officeDatatable) {
          <span>
            <a
              mat-tab-link
              *mifosxHasPermission="'READ_' + officeDatatable.registeredTableName"
              [routerLink]="['./datatables', officeDatatable.registeredTableName]"
              routerLinkActive
              #datatable="routerLinkActive"
              [active]="datatable.isActive"
            >
              {{ officeDatatable.registeredTableName }}
            </a>
          </span>
        }
      </nav>

      <mat-tab-nav-panel #tabPanel class="ms-panel ms-panel--padded office-tab-panel">
        <router-outlet></router-outlet>
      </mat-tab-nav-panel>
    </div>
  </div>
</div>
