<div class="container">
  <div class="ms-page">
    <div class="ms-list-toolbar">
      <div class="ms-filter-bar">
        <div class="ms-search">
          <fa-icon icon="search" class="ms-search__icon" aria-hidden="true"></fa-icon>
          <input
            type="search"
            (input)="applyFilter($any($event.target).value)"
            [placeholder]="'labels.inputs.Filter' | translate"
            [attr.aria-label]="'labels.inputs.Filter' | translate"
          />
        </div>
      </div>
      <div class="ms-actions">
        <button
          mat-flat-button
          color="primary"
          [routerLink]="['create']"
          *mifosxHasPermission="'CREATE_PROVISIONING_CRITERIA'"
        >
          <fa-icon icon="plus" class="m-r-10"></fa-icon>
          {{ 'labels.buttons.Create Provisioning Criteria' | translate }}
        </button>
      </div>
    </div>

    <div class="ms-panel">
      <div class="ms-table-wrap">
        <table mat-table [dataSource]="dataSource" matSort>
          <ng-container matColumnDef="criteriaName">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>{{ 'labels.inputs.name' | translate }}</th>
            <td mat-cell *matCellDef="let loanProvisioningCriteria" class="ms-cell-name">
              {{ loanProvisioningCriteria.criteriaName }}
            </td>
          </ng-container>

          <ng-container matColumnDef="createdBy">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>{{ 'labels.inputs.Created By' | translate }}</th>
            <td mat-cell *matCellDef="let loanProvisioningCriteria" class="ms-cell-muted">
              {{ loanProvisioningCriteria.createdBy }}
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr
            mat-row
            *matRowDef="let row; columns: displayedColumns"
            [routerLink]="[row.criteriaId]"
            class="select-row"
          ></tr>
          <tr class="mat-mdc-row" *matNoDataRow>
            <td class="mat-mdc-cell ms-empty-cell" [attr.colspan]="displayedColumns.length">
              {{ 'labels.text.No results found' | translate }}
            </td>
          </tr>
        </table>
      </div>

      <mat-paginator [pageSizeOptions]="[10, 25, 50, 100]" showFirstLastButtons></mat-paginator>
    </div>
  </div>
</div>
