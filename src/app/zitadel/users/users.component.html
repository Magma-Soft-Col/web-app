<div class="container">
  <div class="ms-page">
    <div class="ms-list-toolbar">
      <div class="ms-filter-bar">
        <div #filter class="ms-search">
          <fa-icon icon="search" class="ms-search__icon" aria-hidden="true"></fa-icon>
          <input
            type="search"
            (keyup)="applyFilter($any($event.target).value)"
            [placeholder]="'labels.inputs.Filter' | translate"
            [attr.aria-label]="'labels.inputs.Filter' | translate"
          />
        </div>
      </div>
      <div class="ms-actions">
        <button mat-stroked-button [routerLink]="['self-service']" *mifosxHasPermission="'READ_SELFSERVICEUSER'">
          <fa-icon icon="users" class="m-r-10"></fa-icon>
          {{ 'labels.text.Self Service Users' | translate }}
        </button>
        <div #buttonCreateUser class="in-block">
          <button mat-flat-button color="primary" [routerLink]="['create']">
            <fa-icon icon="plus" class="m-r-10"></fa-icon>
            {{ 'labels.buttons.Create User' | translate }}
          </button>
        </div>
      </div>
    </div>

    <div class="ms-panel">
      <div class="ms-table-wrap">
        <table mat-table [dataSource]="dataSource" matSort #sortUsers="matSort">
          <ng-container matColumnDef="firstname">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>{{ 'labels.inputs.First Name' | translate }}</th>
            <td mat-cell *matCellDef="let user" class="ms-cell-name">{{ user.firstname }}</td>
          </ng-container>

          <ng-container matColumnDef="lastname">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>{{ 'labels.inputs.Last Name' | translate }}</th>
            <td mat-cell *matCellDef="let user" class="ms-cell-name">{{ user.lastname }}</td>
          </ng-container>

          <ng-container matColumnDef="email">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>{{ 'labels.inputs.Email' | translate }}</th>
            <td mat-cell *matCellDef="let user" class="ms-cell-muted">{{ user.email }}</td>
          </ng-container>

          <ng-container matColumnDef="officeName">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>{{ 'labels.inputs.Office' | translate }}</th>
            <td mat-cell *matCellDef="let user" class="ms-cell-muted">{{ user.officeName }}</td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns" [routerLink]="[row.id]" class="select-row"></tr>
          <tr class="mat-mdc-row" *matNoDataRow>
            <td class="mat-mdc-cell ms-empty-cell" [attr.colspan]="displayedColumns.length">
              {{ 'labels.text.No results found' | translate }}
            </td>
          </tr>
        </table>
      </div>

      <mat-paginator #paginatorUsers [pageSizeOptions]="[10, 25, 50, 100]" showFirstLastButtons></mat-paginator>
    </div>
  </div>
</div>
