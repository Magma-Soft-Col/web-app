<div class="schedule-step">
  <div class="schedule-step__actions">
    <button mat-flat-button color="primary" (click)="showRepaymentInfo()">
      <fa-icon icon="calendar" class="m-r-10"></fa-icon>{{ 'labels.inputs.Generate Repayment Schedule' | translate }}
    </button>
  </div>

  <mifosx-repayment-schedule-tab [repaymentScheduleDetails]="repaymentScheduleDetails" [currencyCode]="currencyCode">
  </mifosx-repayment-schedule-tab>
</div>

<div class="loan-form__actions">
  @if (loanId) {
    <button mat-stroked-button [routerLink]="['../', 'general']">
      {{ 'labels.buttons.Cancel' | translate }}
    </button>
  }
  <button mat-stroked-button matStepperPrevious>
    <fa-icon icon="arrow-left" class="m-r-10"></fa-icon>
    {{ 'labels.buttons.Previous' | translate }}
  </button>
  <button mat-flat-button color="primary" matStepperNext>
    {{ 'labels.buttons.Next' | translate }}
    <fa-icon icon="arrow-right" class="m-l-10"></fa-icon>
  </button>
</div>
