<div class="container">
  <mat-card>
    <form [formGroup]="undoWriteOffForm" (ngSubmit)="submit()">
      <mat-card-content>
        <div class="loan-form__grid">
          <p class="loan-form__full loan-form__intro">
            {{ 'labels.text.Undo Write-off Description' | translate }}
          </p>

          <mat-form-field>
            <mat-label>{{ 'labels.inputs.Reversal External Id' | translate }}</mat-label>
            <input matInput formControlName="reversalExternalId" />
          </mat-form-field>

          <mat-form-field class="loan-form__full">
            <mat-label>{{ 'labels.inputs.Note' | translate }}</mat-label>
            <textarea
              matInput
              formControlName="note"
              cdkTextareaAutosize
              cdkAutosizeMinRows="2"
              maxlength="1000"
            ></textarea>
          </mat-form-field>
        </div>

        <mat-card-actions class="loan-form__actions">
          <button type="button" mat-stroked-button (click)="gotoLoanDefaultView()">
            {{ 'labels.buttons.Cancel' | translate }}
          </button>
          <button
            mat-flat-button
            color="primary"
            [disabled]="!undoWriteOffForm.valid || isSubmitting"
            *mifosxHasPermission="'UNDOWRITEOFF_WORKINGCAPITALLOAN'"
          >
            {{ 'labels.buttons.Submit' | translate }}
          </button>
        </mat-card-actions>
      </mat-card-content>
    </form>
  </mat-card>
</div>
