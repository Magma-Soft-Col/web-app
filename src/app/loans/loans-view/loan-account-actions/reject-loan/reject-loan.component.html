<div class="container">
  <mat-card>
    <form [formGroup]="rejectLoanForm" (ngSubmit)="submit()">
      <mat-card-content>
        <div class="loan-form__grid">
          <mat-form-field (click)="rejectedDatePicker.open()">
            <mat-label>{{ 'labels.inputs.Rejected On' | translate }}</mat-label>
            <input
              matInput
              [min]="minDate"
              [max]="maxDate"
              [matDatepicker]="rejectedDatePicker"
              required
              formControlName="rejectedOnDate"
            />
            <mat-datepicker-toggle matSuffix [for]="rejectedDatePicker"></mat-datepicker-toggle>
            <mat-datepicker #rejectedDatePicker></mat-datepicker>
            @if (rejectLoanForm.controls.rejectedOnDate.hasError('required')) {
              <mat-error>
                {{ 'labels.inputs.Rejected Date' | translate }} {{ 'labels.commons.is' | translate }}
                <strong>{{ 'labels.commons.required' | translate }}</strong>
              </mat-error>
            }
          </mat-form-field>

          <mat-form-field class="loan-form__full">
            <mat-label>{{ 'labels.inputs.Note' | translate }}</mat-label>
            <textarea matInput formControlName="note" cdkTextareaAutosize cdkAutosizeMinRows="2"></textarea>
          </mat-form-field>
        </div>

        <mat-card-actions class="loan-form__actions">
          <button type="button" mat-stroked-button (click)="gotoLoanDefaultView()">
            {{ 'labels.buttons.Cancel' | translate }}
          </button>
          <button
            mat-flat-button
            color="primary"
            [disabled]="!rejectLoanForm.valid"
            *mifosxHasPermission="'REJECT_LOAN'"
          >
            {{ 'labels.buttons.Submit' | translate }}
          </button>
        </mat-card-actions>
      </mat-card-content>
    </form>
  </mat-card>
</div>
