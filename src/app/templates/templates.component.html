<div class="container">
  <div class="ms-page">
    <div class="ms-list-toolbar">
      <div class="ms-filter-bar">
        <div class="ms-search">
          <fa-icon icon="search" class="ms-search__icon" aria-hidden="true"></fa-icon>
          <input
            type="search"
            (keyup)="applyFilter($any($event.target).value)"
            [placeholder]="'labels.inputs.Filter' | translate"
            [attr.aria-label]="'labels.inputs.Filter' | translate"
          />
        </div>
      </div>
      <div class="ms-actions">
        <button mat-flat-button color="primary" [routerLink]="['create']" *mifosxHasPermission="'CREATE_TEMPLATE'">
          <fa-icon icon="plus" class="m-r-10"></fa-icon>
          {{ 'labels.buttons.Create Template' | translate }}
        </button>
      </div>
    </div>

    <div class="ms-panel">
      <div class="ms-table-wrap">
        <table mat-table [dataSource]="dataSource" matSort>
          <ng-container matColumnDef="entity">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>{{ 'labels.inputs.Entity' | translate }}</th>
            <td mat-cell *matCellDef="let template" class="ms-cell-name">{{ template.entity }}</td>
          </ng-container>

          <ng-container matColumnDef="type">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>{{ 'labels.inputs.Type' | translate }}</th>
            <td mat-cell *matCellDef="let template">{{ template.type }}</td>
          </ng-container>

          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>{{ 'labels.inputs.name' | translate }}</th>
            <td mat-cell *matCellDef="let template">{{ template.name }}</td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns" [routerLink]="[row.id]" class="select-row"></tr>
          <tr class="mat-mdc-row" *matNoDataRow>
            <td class="mat-mdc-cell ms-empty-cell" [attr.colspan]="displayedColumns.length">
              {{ 'labels.text.No results found' | translate }}
            </td>
          </tr>
        </table>
      </div>

      <mat-paginator [pageSizeOptions]="[10, 25, 50, 100]" showFirstLastButtons></mat-paginator>
    </div>
  </div>
</div>
