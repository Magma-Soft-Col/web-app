<div class="container">
  <div class="ms-page">
    <div class="ms-actions align-end">
      <button mat-stroked-button color="warn" (click)="delete()" *mifosxHasPermission="'DELETE_TEMPLATE'">
        <fa-icon icon="trash" class="m-r-10"></fa-icon>
        {{ 'labels.buttons.Delete' | translate }}
      </button>

      <button mat-flat-button color="primary" [routerLink]="['edit']" *mifosxHasPermission="'UPDATE_TEMPLATE'">
        <fa-icon icon="edit" class="m-r-10"></fa-icon>
        {{ 'labels.buttons.Edit' | translate }}
      </button>
    </div>

    <mat-card>
      <mat-card-content>
        <div class="detail-list">
          <div class="ms-detail-row">
            <span class="ms-label">{{ 'labels.inputs.name' | translate }}</span>
            <span class="ms-value">{{ templateData.name }}</span>
          </div>

          <div class="ms-detail-row">
            <span class="ms-label">{{ 'labels.inputs.Entity' | translate }}</span>
            <span class="ms-value">{{ templateData.entity }}</span>
          </div>

          <div class="ms-detail-row">
            <span class="ms-label">{{ 'labels.inputs.Type' | translate }}</span>
            <span class="ms-value">{{ templateData.type }}</span>
          </div>
        </div>

        <h3 class="ms-subsection-title text-label">{{ 'labels.inputs.Text' | translate }}</h3>

        @if (isHtml) {
          <!-- Sandboxed: the template's own styles apply while its scripts never run -->
          <iframe
            #preview
            class="html-preview"
            sandbox="allow-same-origin"
            [srcdoc]="htmlPreview"
            [title]="'labels.inputs.Text' | translate"
            (load)="onPreviewLoad(preview)"
          ></iframe>
        } @else {
          <div class="plain-text">{{ templateData.text }}</div>
        }
      </mat-card-content>
    </mat-card>
  </div>
</div>
