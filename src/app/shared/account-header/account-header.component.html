<!-- Entity header (pen): identification, status and key facts of a client, group or center. -->
<section class="ms-entity-header account-header">
  <div class="ms-entity-header__identity account-header__identity">
    <div class="profile-image-container account-header__media">
      <ng-content select="[accountImage]"></ng-content>
      <ng-content select="[accountImageActions]"></ng-content>
      <ng-content select="[accountImageFooter]"></ng-content>
    </div>

    <div class="ms-entity-header__block account-header__main">
      <h2 class="ms-entity-header__row account-header__title">
        @if (statusCode) {
          <span
            class="account-header__dot"
            [ngClass]="statusCode | statusLookup"
            [matTooltip]="statusTooltip"
            [attr.aria-label]="statusTooltip"
            role="img"
          ></span>
        }
        <ng-content select="[accountTitle]"></ng-content>
      </h2>

      <div class="account-header__meta">
        <ng-content select="[accountMetadata]"></ng-content>
      </div>
    </div>
  </div>

  <div class="account-header__menu">
    <ng-content select="[accountMenu]"></ng-content>
  </div>
</section>
