<div class="container">
  <mat-card>
    <form [formGroup]="clientAssignStaffForm" (ngSubmit)="submit()">
      <mat-card-content>
        <div class="action-form__grid">
          <mat-form-field>
            <mat-label>{{ 'labels.inputs.Staff' | translate }}</mat-label>
            <mat-select formControlName="staffId">
              @for (staff of staffData; track staff) {
                <mat-option [value]="staff.id">
                  {{ staff.displayName }}
                </mat-option>
              }
            </mat-select>
            @if (clientAssignStaffForm.controls.staffId.hasError('required')) {
              <mat-error>
                {{ 'labels.inputs.Staff' | translate }} {{ 'labels.commons.is' | translate }}
                <strong>{{ 'labels.commons.required' | translate }}</strong>
              </mat-error>
            }
          </mat-form-field>
        </div>
      </mat-card-content>

      <mat-card-actions class="action-form__actions">
        <button type="button" mat-stroked-button [routerLink]="['../../']">
          {{ 'labels.buttons.Cancel' | translate }}
        </button>
        <button mat-flat-button color="primary" [disabled]="!clientAssignStaffForm.valid">
          {{ 'labels.buttons.Confirm' | translate }}
        </button>
      </mat-card-actions>
    </form>
  </mat-card>
</div>
