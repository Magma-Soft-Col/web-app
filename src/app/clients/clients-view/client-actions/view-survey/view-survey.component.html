<div class="container">
  <div class="ms-page">
    <div class="ms-list-toolbar">
      <div class="ms-filter-bar">
        <div class="ms-search">
          <fa-icon icon="search" class="ms-search__icon" aria-hidden="true"></fa-icon>
          <input
            type="search"
            (keyup)="applyFilter($any($event.target).value)"
            [placeholder]="'labels.inputs.Filter' | translate"
            [attr.aria-label]="'labels.inputs.Filter' | translate"
          />
        </div>
      </div>
      <div class="ms-actions">
        <button mat-flat-button color="primary" [routerLink]="['../Take Survey']">
          <fa-icon icon="edit" class="m-r-10"></fa-icon>
          {{ 'labels.buttons.Take Survey' | translate }}
        </button>
      </div>
    </div>

    <div class="ms-panel">
      <div class="ms-table-wrap">
        <table mat-table [dataSource]="dataSource" matSort class="survey-table">
          <ng-container matColumnDef="surveyName">
            <th mat-header-cell *matHeaderCellDef mat-sort-header="surveyName">
              {{ 'labels.inputs.Survey' | translate }}
            </th>
            <td mat-cell *matCellDef="let survey" class="survey-name">{{ survey.surveyName }}</td>
          </ng-container>

          <ng-container matColumnDef="createdBy">
            <th mat-header-cell *matHeaderCellDef mat-sort-header="createdBy">
              {{ 'labels.inputs.Created By' | translate }}
            </th>
            <td mat-cell *matCellDef="let survey">{{ survey.createdBy }}</td>
          </ng-container>

          <ng-container matColumnDef="date">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>{{ 'labels.inputs.DateTime' | translate }}</th>
            <td mat-cell *matCellDef="let survey">{{ survey.date | datetimeFormat }}</td>
          </ng-container>

          <ng-container matColumnDef="score">
            <th mat-header-cell *matHeaderCellDef mat-sort-header class="ms-num">
              {{ 'labels.inputs.Score' | translate }}
            </th>
            <td mat-cell *matCellDef="let survey" class="ms-num">{{ survey.score | formatNumber }}</td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>
      </div>

      <mat-paginator [pageSizeOptions]="[10, 25, 50, 100]" showFirstLastButtons></mat-paginator>
    </div>
  </div>
</div>
