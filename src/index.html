    <!-- Load environment variables -->
    <!--
      Magma Soft launch screen, inlined so it paints before the app styles load.
      Same "despegue" animation as the magmasoft landing page; hidden by
      app/core/splash/splash.ts once the first route has rendered.
    -->
    <script>
      try {
        if (localStorage.getItem('mifosXThemeDarkEnabled') === 'true') {
          document.documentElement.classList.add('ms-boot-dark');
        }
      } catch (e) {}
    </script>
    <style>
      .cargador {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: #fff;
        transition:
          opacity 0.5s ease 0.25s,
          visibility 0.5s ease 0.25s;
      }
      .ms-boot-dark .cargador,
      body.dark-theme .cargador {
        background: #0f172a;
      }
      .cargador .logo-oscuro,
      .ms-boot-dark .cargador .logo-claro,
      body.dark-theme .cargador .logo-claro {
        display: none;
      }
      .ms-boot-dark .cargador .logo-oscuro,
      body.dark-theme .cargador .logo-oscuro {
        display: block;
      }
      .cargador-logo {
        animation:
          magmaSubir 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards,
          magmaFlotar 0.9s cubic-bezier(0.4, 0, 0.2, 1) 0.3s infinite;
      }
      .cargador-logo img {
        width: 160px;
        height: auto;
        filter: drop-shadow(0 15px 25px rgba(206, 88, 0, 0.5));
      }
      .cargador.despegue .cargador-logo {
        animation: magmaDespegar 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
      .cargador.despegue {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      @keyframes magmaSubir {
        from {
          transform: translateY(100vh) scale(0.8);
          opacity: 0;
        }
        to {
          transform: translateY(10px) scale(1);
          opacity: 1;
        }
      }
      @keyframes magmaFlotar {
        0%,
        100% {
          transform: translateY(10px);
        }
        33% {
          transform: translateY(-5px);
        }
        66% {
          transform: translateY(5px);
        }
      }
      @keyframes magmaDespegar {
        from {
          transform: translateY(-15px) scale(1);
          opacity: 1;
        }
        to {
          transform: translateY(-150vh) scale(1.1);
          opacity: 0;
        }
      }
      @media (min-width: 768px) {
        .cargador-logo img {
          width: 176px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .cargador-logo,
        .cargador.despegue .cargador-logo {
          animation: none;
        }
      }
    </style>

    <!--
      OAuth Redirect Interceptor (PRODUCTION)
      -------------------------------------
      OAuth providers cannot redirect to hash-based routes (#).
      This script intercepts OAuth callbacks BEFORE Angular initializes,
      stores the response parameters, and rewrites the URL to a hash route
      that Angular can handle.

      DO NOT remove unless migrating to path-based routing.
    -->
    <script>
      (function () {
        // ===== CONFIGURATION =====
        var OAUTH_CALLBACK_PATHS = ['/callback'];
        var STORAGE_KEY = 'oauth_callback_query';

        // ===== DETECTION =====
        var params = new URLSearchParams(window.location.search);
        var isOAuthResponse = params.has('code') || params.has('error');

        if (!isOAuthResponse) {
          return;
        }

        // Prevent redirect loop
        if (window.location.hash && window.location.hash.length > 1) {
          return;
        }

        var currentPath = window.location.pathname;

        // Only allow known OAuth callback paths
        if (OAUTH_CALLBACK_PATHS.indexOf(currentPath) === -1) {
          return;
        }

        // ===== PERSIST & REDIRECT =====
        try {
          sessionStorage.setItem(STORAGE_KEY, window.location.search);
        } catch (e) {
          console.warn('OAuth interceptor: sessionStorage unavailable, appending query to hash');
        }

        // Always redirect, even if storage fails
        var redirectUrl = window.location.origin + '/#' + currentPath;

        if (!sessionStorage.getItem(STORAGE_KEY)) {
          redirectUrl += window.location.search;
        }

        window.location.replace(redirectUrl);
      })();
    </script>
